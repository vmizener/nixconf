# Public SSH key registry for incoming `authorized_keys` (modules/common/ssh.nix).
#
# Rules:
# - Only user client `.pub` keys (`~/.ssh/id_*.pub`) go here—never `/etc/ssh/ssh_host_*`
#   server keys or `.sops.yaml` age keys.
# - `[authorize.*]` only populates `authorized_keys` for OS accounts already declared on
#   a target; it never creates user accounts.
# - Every alias referenced in `[authorize.*]` must exist in `[keys]` (`just check`).

# Client public keys: `"<user>@<host>" = "<public_key>"`
# Named `"<user>@<host>"` by convention (`@` requires TOML quotes), though any label
# (e.g. "yubikey") works. Trailing key comments are ignored by sshd.
#
# Use case: Register keys for accounts/devices you SSH *from* (your desktop, Steam Deck,
# or work laptop). Headless servers you only SSH *into* (e.g. `zeltennia`) don't need a
# key here unless they also initiate outbound SSH to other managed hosts.
[keys]
"bao@baohaus" = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIERfW0Qqnb8ka356BMCassHUsWciHdDZQglY65aoCfLB"
# "deck@steamdeck" = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA..."
# "rvonmizener@rvm-x" = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA..."

# Global authorizations (`ssh <target_user>@*`): `<target_user> = ["<key_alias>", ...]`
# Grants listed client keys login to `<target_user>` on *every* NixOS & standalone HM
# target where `<target_user>` is declared.
#
# Use case: Your main user `bao` exists on `baohaus`, `igros`, and `zeltennia`—listing
# your personal/work client keys once here lets all of them `ssh bao@<any-host>`.
[authorize.all_hosts]
bao = ["bao@baohaus"]
# bao = ["bao@baohaus", "deck@steamdeck", "rvonmizener@rvm-x"]

# Per-host NixOS authorizations (`ssh <target_user>@<host>`): merged with `all_hosts`.
# `<host>` must be a declared NixOS host and `<target_user>` must exist on that host.
#
# Use case: Grant scoped or cross-user access on a single machine—e.g. letting your
# desktop (`bao@baohaus`) `ssh ramza@igros` to administer `igros` without authorizing it
# on any other host.
[authorize.hosts]
# [authorize.hosts.igros]
# ramza = ["bao@baohaus"]
