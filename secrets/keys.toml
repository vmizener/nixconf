# Public SSH key registry (loaded by modules/common/ssh.nix).
# Tip: Trailing user@host comments on public keys are optional and ignored by sshd.

[keys]
# baohaus = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA..."
# steamdeck = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA..."
# workstation = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA..."

# Keys authorized for a user across all hosts (NixOS & standalone Home-Manager)
[users]
# bao = ["baohaus", "steamdeck", "workstation"]

# Additional per-host user authorizations on NixOS (merged with [users])
[hosts]
# [hosts.igros]
# ramza = ["baohaus"]
