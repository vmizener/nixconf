ports:
  dns: @DNS_PORT@
  http: @HTTP_PORT@

upstreams:
  groups:
    default:
      - https://one.one.one.one/dns-query
      - https://dns.quad9.net/dns-query
      - 8.8.8.8

bootstrapDns:
  - 1.1.1.1
  - 9.9.9.9

@CUSTOM_DNS_BLOCK@

blocking:
  denylists:
    ads:
      - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
  clientGroupsBlock:
    default:
      - ads
  loading:
    concurrency: 2
    strategy: fast

caching:
  minTime: 5m
  maxTime: 30m
  prefetching: true
